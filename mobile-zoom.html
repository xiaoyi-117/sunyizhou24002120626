<!DOCTYPE html>
<!--
  作者：孙溢周24002120626
  建立时间：2026-11-18
  使用大模型：DeepSeek-V4.1-Flash
  功能名称：移动端图片查看器（双指缩放 / 单指拖动 / 双击放大）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图片查看器 · 双指缩放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 20px 16px 40px;
            color: #2f2749;
            background:
                radial-gradient(circle at 8% 4%, #e6dcff 0%, transparent 46%),
                radial-gradient(circle at 94% 2%, #ffe4ef 0%, transparent 40%),
                linear-gradient(180deg, #fbf9ff 0%, #f3eefc 100%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }
        .syz_app {
            max-width: 520px;
            margin: 0 auto;
        }
        .syz_back-home {
            display: inline-block;
            margin-bottom: 18px;
            padding: 8px 16px;
            background: #fff;
            border: 1px solid #eee4f8;
            color: #6d4fc4;
            border-radius: 10px;
            font-size: 13px;
            text-decoration: none;
        }
        .syz_back-home:hover {
            background: linear-gradient(135deg, #ab8cf6, #8565d8);
            color: #fff;
        }
        .syz_head {
            text-align: center;
            margin-bottom: 18px;
        }
        .syz_head h1 {
            font-size: 24px;
            letter-spacing: 2px;
            color: #3a2c62;
        }
        .syz_head p {
            margin-top: 8px;
            color: #9c90b8;
            font-size: 13px;
            letter-spacing: 1px;
        }
        /* 图片容器：裁掉超出部分，接管全部触摸手势，且不允许选中文字/长按菜单 */
        .syz_viewer {
            position: relative;
            width: 100%;
            height: 62vh;
            max-height: 480px;
            overflow: hidden;
            border-radius: 20px;
            background: #16111f;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-shadow: 0 16px 36px rgba(96, 66, 170, 0.2);
        }
        /* 图片铺满容器，缩放与平移都通过 transform 完成（移动端走 GPU，不触发重排） */
        .syz_photo {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            will-change: transform;
            pointer-events: none;
        }
        /* 需要动画时临时加上这个类：0.25s 过渡，手指操作期间会移除，保证跟手 */
        .syz_photo.syz_animating {
            transition: transform 0.25s ease;
        }
        .syz_status {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            letter-spacing: 1px;
            color: #6d5c93;
        }
        .syz_status span {
            color: #8a6be0;
            font-weight: 700;
        }
        .syz_tip {
            margin-top: 8px;
            text-align: center;
            font-size: 12.5px;
            color: #a196bb;
            line-height: 1.9;
        }
        /* 打开页面时的提示条，2.6 秒后淡出 */
        .syz_toast {
            position: fixed;
            left: 50%;
            bottom: 46px;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(47, 39, 73, 0.9);
            color: #fff;
            font-size: 13px;
            letter-spacing: 1px;
            white-space: nowrap;
            transition: opacity 0.3s, visibility 0.3s;
            z-index: 10;
        }
        .syz_toast.syz_hide {
            opacity: 0;
            visibility: hidden;
        }
        /* 手机端效果演示视频 */
        .syz_demo {
            margin-top: 24px;
            padding: 20px 22px 22px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid #ece5fb;
        }
        .syz_demo h2 {
            font-size: 15px;
            color: #4a3d6b;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }
        .syz_demo-video {
            display: block;
            width: 100%;
            border-radius: 14px;
            background: #16111f;
        }
        .syz_demo p {
            margin-top: 12px;
            font-size: 12.5px;
            line-height: 1.8;
            color: #a196bb;
        }
    </style>
</head>
<body>
    <div class="syz_app">
        <a class="syz_back-home" href="index.html">返回首页</a>
        <div class="syz_head">
            <h1>图片查看器</h1>
            <p>双指缩放 · 单指拖动 · 双击放大</p>
        </div>

        <div class="syz_viewer" id="syz_viewer">
            <img class="syz_photo" id="syz_photo" src="img/viewer.jpg" alt="风景大图" draggable="false">
        </div>

        <p class="syz_status">当前缩放：<span id="syz_scaleText">1.0×</span></p>
        <p class="syz_tip">缩放范围 1～4 倍，松开手指后自动回到边界内</p>

        <section class="syz_demo">
            <h2>手机端效果演示</h2>
            <video class="syz_demo-video" src="video(51).mp4"
                   controls playsinline webkit-playsinline preload="metadata"></video>
            <p>视频演示：在手机上双指缩放、单指拖动、双击放大图片的完整效果。</p>
        </section>
    </div>

    <div class="syz_toast" id="syz_toast">双指缩放请用手机打开</div>

    <script>
        const syz_viewer = document.getElementById('syz_viewer');
        const syz_photo = document.getElementById('syz_photo');
        const syz_scaleText = document.getElementById('syz_scaleText');
        const syz_toast = document.getElementById('syz_toast');

        // 缩放范围与双击倍率
        const syz_MIN_SCALE = 1;
        const syz_MAX_SCALE = 4;
        const syz_DOUBLE_SCALE = 2;

        let syz_scale = 1;       // 当前缩放倍数
        let syz_tx = 0;          // 当前水平平移量（px，相对容器中心）
        let syz_ty = 0;          // 当前垂直平移量（px，相对容器中心）

        // gesture：'none' 无手势、'pinch' 双指缩放、'drag' 单指拖动
        let syz_gesture = 'none';

        // 双指手势按下时的快照：初始两指距离、初始中点、初始缩放与位移
        let syz_startDistance = 0;
        let syz_startScale = 1;
        let syz_startMidX = 0;
        let syz_startMidY = 0;
        let syz_startTx = 0;
        let syz_startTy = 0;

        // 单指拖动按下时的快照
        let syz_dragStartX = 0;
        let syz_dragStartY = 0;
        let syz_dragStartTx = 0;
        let syz_dragStartTy = 0;

        // 轻点/双击识别：本次按下的屏幕坐标，以及上一次轻点的时间与位置
        let syz_tapClientX = 0;
        let syz_tapClientY = 0;
        let syz_singleFinger = false;
        let syz_lastTapTime = 0;
        let syz_lastTapX = 0;
        let syz_lastTapY = 0;

        // 提示条的自动隐藏定时器
        let syz_toastTimer = null;

        // 函数功能：把触点坐标换算成相对容器中心的坐标，作为缩放锚点与拖动量的计算基准
        function syz_pointOf(syz_touch) {
            const syz_rect = syz_viewer.getBoundingClientRect();
            return {
                x: syz_touch.clientX - syz_rect.left - syz_rect.width / 2,
                y: syz_touch.clientY - syz_rect.top - syz_rect.height / 2
            };
        }

        // 函数功能：计算两个触点之间的直线距离（用于双指缩放的比例）
        function syz_distanceOf(syz_a, syz_b) {
            return Math.hypot(syz_a.clientX - syz_b.clientX, syz_a.clientY - syz_b.clientY);
        }

        // 函数功能：按当前缩放倍数限制平移量，保证图片不会拖出容器边界
        function syz_clampPos(syz_nextTx, syz_nextTy, syz_nextScale) {
            const syz_maxX = (syz_viewer.clientWidth * (syz_nextScale - 1)) / 2;
            const syz_maxY = (syz_viewer.clientHeight * (syz_nextScale - 1)) / 2;
            return {
                x: Math.min(syz_maxX, Math.max(-syz_maxX, syz_nextTx)),
                y: Math.min(syz_maxY, Math.max(-syz_maxY, syz_nextTy))
            };
        }

        // 函数功能：把当前的缩放与平移写到图片的 transform 上，并同步右下角的倍数文字；animate 为 true 时带 0.25s 过渡
        function syz_apply(syz_animate) {
            if (syz_animate) {
                syz_photo.classList.add('syz_animating');
            } else {
                syz_photo.classList.remove('syz_animating');
            }
            syz_photo.style.transform = 'translate3d(' + syz_tx + 'px, ' + syz_ty + 'px, 0) scale(' + syz_scale + ')';
            syz_scaleText.textContent = syz_scale.toFixed(1) + '×';
        }

        // 函数功能：隐藏打开页面时的「双指缩放请用手机打开」提示条
        function syz_hideToast() {
            clearTimeout(syz_toastTimer);
            syz_toast.classList.add('syz_hide');
        }

        // 函数功能：双击时在 1 倍与 2 倍之间切换，并以双击位置为缩放基准，带 0.25s 过渡
        function syz_toggleZoom(syz_point) {
            const syz_to = syz_scale > 1.2 ? syz_MIN_SCALE : syz_DOUBLE_SCALE;
            const syz_k = syz_to / syz_scale;

            // 让双击点下的图像内容保持在原位：新位移 = 锚点 - (锚点 - 旧位移) × 缩放比
            let syz_nextTx = 0;
            let syz_nextTy = 0;
            if (syz_to > 1) {
                syz_nextTx = syz_point.x - (syz_point.x - syz_tx) * syz_k;
                syz_nextTy = syz_point.y - (syz_point.y - syz_ty) * syz_k;
            }

            const syz_limited = syz_clampPos(syz_nextTx, syz_nextTy, syz_to);
            syz_scale = syz_to;
            syz_tx = syz_limited.x;
            syz_ty = syz_limited.y;
            syz_apply(true);
        }

        // 函数功能：手指按下时判断单指/双指，记录两指初始距离与中点，或记录单指拖动起点
        function syz_onTouchStart(syz_e) {
            syz_hideToast();

            // 手指操作期间不要过渡动画，否则缩放/拖动会滞后于手指
            syz_photo.classList.remove('syz_animating');
            syz_singleFinger = syz_e.touches.length === 1;

            if (syz_e.touches.length >= 2) {
                syz_gesture = 'pinch';
                syz_startDistance = syz_distanceOf(syz_e.touches[0], syz_e.touches[1]);

                const syz_midA = syz_pointOf(syz_e.touches[0]);
                const syz_midB = syz_pointOf(syz_e.touches[1]);
                syz_startMidX = (syz_midA.x + syz_midB.x) / 2;
                syz_startMidY = (syz_midA.y + syz_midB.y) / 2;

                syz_startScale = syz_scale;
                syz_startTx = syz_tx;
                syz_startTy = syz_ty;
                return;
            }

            // 单指：记录按下位置，放大状态下才允许拖动
            const syz_point = syz_pointOf(syz_e.touches[0]);
            syz_tapClientX = syz_e.touches[0].clientX;
            syz_tapClientY = syz_e.touches[0].clientY;
            syz_dragStartX = syz_point.x;
            syz_dragStartY = syz_point.y;
            syz_dragStartTx = syz_tx;
            syz_dragStartTy = syz_ty;
            syz_gesture = syz_scale > 1 ? 'drag' : 'none';
        }

        // 函数功能：双指时按两指距离比例实时缩放（1～4 倍）并以两指中点为基准；单指且已放大时拖动图片
        function syz_onTouchMove(syz_e) {
            syz_e.preventDefault();

            if (syz_gesture === 'pinch' && syz_e.touches.length >= 2) {
                const syz_distance = syz_distanceOf(syz_e.touches[0], syz_e.touches[1]);
                if (!syz_startDistance) {
                    return;
                }

                // 距离比例 × 按下时的倍数，再夹到 1～4 倍之间
                const syz_ratio = syz_distance / syz_startDistance;
                const syz_nextScale = Math.min(syz_MAX_SCALE, Math.max(syz_MIN_SCALE, syz_startScale * syz_ratio));
                const syz_k = syz_nextScale / syz_startScale;

                const syz_midA = syz_pointOf(syz_e.touches[0]);
                const syz_midB = syz_pointOf(syz_e.touches[1]);
                const syz_midX = (syz_midA.x + syz_midB.x) / 2;
                const syz_midY = (syz_midA.y + syz_midB.y) / 2;

                // 以两指中点为基准：按下时中点下的那一点，移动到当前中点下
                const syz_nextTx = syz_midX - (syz_startMidX - syz_startTx) * syz_k;
                const syz_nextTy = syz_midY - (syz_startMidY - syz_startTy) * syz_k;

                syz_scale = syz_nextScale;
                syz_tx = syz_nextTx;
                syz_ty = syz_nextTy;
                syz_apply(false);
                return;
            }

            if (syz_gesture === 'drag' && syz_e.touches.length === 1) {
                const syz_point = syz_pointOf(syz_e.touches[0]);

                // 拖动过程中自由跟手，边界在松手时再统一限制
                syz_tx = syz_dragStartTx + (syz_point.x - syz_dragStartX);
                syz_ty = syz_dragStartTy + (syz_point.y - syz_dragStartY);
                syz_apply(false);
            }
        }

        // 函数功能：手指抬起时处理三种情况——双指松开一根转为拖动、双击切换 1x/2x、手势结束后回弹到边界内
        function syz_onTouchEnd(syz_e) {
            // 还有一根手指按着：把剩下的手指当成新的拖动起点
            if (syz_e.touches.length === 1) {
                const syz_point = syz_pointOf(syz_e.touches[0]);
                syz_gesture = syz_scale > 1 ? 'drag' : 'none';
                syz_dragStartX = syz_point.x;
                syz_dragStartY = syz_point.y;
                syz_dragStartTx = syz_tx;
                syz_dragStartTy = syz_ty;
                syz_singleFinger = false;
                return;
            }

            if (syz_e.touches.length > 0) {
                return;
            }

            // 全部手指离开：先判断是不是轻点，再决定是否触发双击缩放
            const syz_endX = syz_e.changedTouches[0].clientX;
            const syz_endY = syz_e.changedTouches[0].clientY;
            const syz_moved = Math.abs(syz_endX - syz_tapClientX) > 10 ||
                              Math.abs(syz_endY - syz_tapClientY) > 10;
            const syz_isTap = syz_singleFinger && !syz_moved;
            const syz_now = Date.now();

            if (syz_isTap && syz_now - syz_lastTapTime < 300) {
                // 300ms 内第二次轻点且位置接近 → 双击
                const syz_rect = syz_viewer.getBoundingClientRect();
                const syz_nearX = Math.abs(syz_endX - syz_lastTapX) < 40;
                const syz_nearY = Math.abs(syz_endY - syz_lastTapY) < 40;
                if (syz_nearX && syz_nearY) {
                    syz_toggleZoom({
                        x: syz_endX - syz_rect.left - syz_rect.width / 2,
                        y: syz_endY - syz_rect.top - syz_rect.height / 2
                    });
                    syz_lastTapTime = 0;
                    syz_gesture = 'none';
                    return;
                }
            }

            if (syz_isTap) {
                syz_lastTapTime = syz_now;
                syz_lastTapX = syz_endX;
                syz_lastTapY = syz_endY;
            } else {
                syz_lastTapTime = 0;
            }

            // 松手后收尾：缩放接近 1 就回到 1 倍并居中，否则把位移限制在边界内，带 0.25s 过渡
            if (syz_scale < 1.05) {
                syz_scale = 1;
                syz_tx = 0;
                syz_ty = 0;
            } else {
                const syz_limited = syz_clampPos(syz_tx, syz_ty, syz_scale);
                syz_tx = syz_limited.x;
                syz_ty = syz_limited.y;
            }
            syz_gesture = 'none';
            syz_apply(true);
        }

        // 函数功能：页面初始化，绑定触摸事件、渲染初始 1 倍状态，并弹出「双指缩放请用手机打开」提示
        function syz_init() {
            syz_viewer.addEventListener('touchstart', syz_onTouchStart, { passive: true });
            syz_viewer.addEventListener('touchmove', syz_onTouchMove, { passive: false });
            syz_viewer.addEventListener('touchend', syz_onTouchEnd);
            syz_viewer.addEventListener('touchcancel', syz_onTouchEnd);

            syz_apply(false);

            syz_toastTimer = setTimeout(syz_hideToast, 2600);
        }

        syz_init();
    </script>
</body>
</html>
